# Dutch (TenneT) imbalance settlement rules — single source of truth.
#
# RIGOUR ZONE (CLAUDE.md §12). Every downstream module reads settlement logic
# and publication lags from this file. Do not duplicate these constants in code.
#
# Primary source unless noted otherwise:
#   [IPS61] TenneT TSO B.V., "Imbalance Pricing System: how are the (directions
#           of) payment determined?", version 6.1, 21 October 2024.
#           docs/refs/TenneT_Imbalance_Pricing_System_v6.1_2024-10-21.pdf
#           Changelog entry for 6.1: "Clarification on PICASSO impact".
#           Section/table references below were verified against v6.1 by diffing
#           it against v6.0; §4.2, §4.3 and §5 Table 2 are substantively
#           UNCHANGED between the two versions apart from the additions noted.
#   [STCRT] Staatscourant 2024 nr. 29868, cited by [IPS61] fn.14 as the legal
#           basis for the PICASSO price-determination clarification.
#           https://zoek.officielebekendmakingen.nl/stcrt-2024-29868.html
#
# Confidence tags on every block:
#   primary   — taken verbatim from a TSO/regulator/EU-law document
#   secondary — trade press or vendor blog; MUST be upgraded before it is relied on
#   assumed   — our modelling choice, not a fact about the market

meta:
  market: NL
  tso: TenneT TSO B.V.
  timezone_internal: UTC
  timezone_presentation: Europe/Amsterdam
  rules_version: "2024-10-21/IPS-6.1"
  last_reviewed: "2026-08-04"

# ---------------------------------------------------------------------------
# Q1 — Imbalance Settlement Period
# ---------------------------------------------------------------------------
isp:
  length_minutes: 15
  confidence: primary
  # [IPS61] Table 1: "The ISP is fixed at 15 minutes."
  # NL has used a 15-minute settlement period since market opening; the EBGL
  # 15-min ISP harmonisation deadline did not change NL practice.
  source: "[IPS61] §2 Table 1"

# ---------------------------------------------------------------------------
# Q2 — Regulation states
# ---------------------------------------------------------------------------
# [IPS61] §4.3: "The four regulation states 0, +1, -1 and 2 describe various
# activation situations of FRR by TenneT per ISP".
regulation_states:
  0:
    name: no_regulation
    description: >
      TenneT does not regulate upward or downward during the ISP. Also applies
      when Load Frequency Control is inactive, and when BRP deviations net out
      via cross-border imbalance netting (IGCC) without an aFRR activation.
    confidence: primary
  1:
    name: upward_only
    description: >
      TenneT only regulates upward during the ISP. Also applies when both
      directions are activated but the intra-ISP series of balance deltas is
      continuously non-decreasing.
    confidence: primary
  -1:
    name: downward_only
    description: >
      TenneT only regulates downward during the ISP. Also applies when both
      directions are activated but the intra-ISP series of balance deltas is
      continuously non-increasing.
    confidence: primary
  2:
    name: both_directions
    description: >
      Both upward and downward regulation occur within the ISP AND the series of
      balance deltas within the ISP both increases and decreases. This is the
      only dual-priced state.
    confidence: primary
  source: "[IPS61] §4.3"

  # [IPS61] §4.3, added in v6.1: "There is no direct impact of participation in
  # IGCC or PICASSO on the regulation state." Participation changes the power
  # imbalance itself (a Dutch shortage can be netted away, or flipped into a
  # surplus), but the state-determination rule is untouched.
  igcc_picasso_affects_state_rule: false

  # WHICH SERIES the monotonicity test is applied to. This is NOT a cosmetic
  # detail: the rule asks whether the balance-delta series "continuously
  # increases", so the SAMPLING RATE of that series changes the answer.
  # TenneT changed this input on 2026-02-03 (see structural_breaks).
  state_determination_input:
    until_2026_02_03: balance_delta_1_minute    # 15 samples per ISP
    from_2026_02_03: balance_delta_12_second    # 75 samples per ISP
    confidence: primary
    source: "TenneT news, 'Balance delta now published every 12 seconds', 25 Nov 2025"

# ---------------------------------------------------------------------------
# Q3 — Price formation and dual pricing
# ---------------------------------------------------------------------------
# Component prices, all €/MWh, all determined per ISP:
#   p_up   — highest-priced ACTIVATED aFRR upward bid in the ISP, or the upward
#            mFRRda price if that is higher.               [IPS61] §4.2
#   p_down — lowest-priced ACTIVATED aFRR downward bid in the ISP, or the
#            downward mFRRda price if that is lower. May be negative. [IPS61] §4.2
#   p_mid  — average of the LOWEST upward bid price and the HIGHEST downward bid
#            price on the merit order (offered, not necessarily activated).
#                                                          [IPS61] §2, §4.2
#
# Two settlement prices exist per ISP:
#   price_long  — settles a BRP SURPLUS (injected more / withdrew less than schedule)
#   price_short — settles a BRP SHORTAGE (injected less / withdrew more than schedule)
#
# Encoded from [IPS61] §5 Table 2.
pricing:
  confidence: primary
  source: "[IPS61] §4.2, §5 Table 2"
  fallback_no_price: previous_isp   # [IPS61] §4.2 third bullet
  rules:
    0:
      price_long:  p_mid
      price_short: p_mid
    1:
      price_long:  p_up
      price_short: p_up
    -1:
      price_long:  p_down
      price_short: p_down
    2:
      # Dual pricing WITH the reverse-pricing correction to the mid-price.
      # Table 2, state 2, BRP shortage: p_up if p_up >= p_mid else p_mid
      # Table 2, state 2, BRP surplus:  p_down if p_down <= p_mid else p_mid
      price_long:  min(p_down, p_mid)
      price_short: max(p_up, p_mid)

# Sign / cash-flow convention. [IPS61] §4.1 and §5 Table 2 direction-of-payment column.
#   Volumes are signed as seen from the grid: BRP surplus is POSITIVE,
#   BRP shortage is NEGATIVE.
#   Net cash to the BRP, with e_surplus and e_shortage as POSITIVE MWh magnitudes:
#
#     cash_to_brp = price_long * e_surplus  -  price_short * e_shortage
#
#   This single expression reproduces every row of Table 2, including the
#   negative-price rows where the direction of payment flips.
settlement:
  confidence: primary
  source: "[IPS61] §4.1, §5 Table 2, §6.1"
  cash_to_brp_formula: "price_long * e_surplus - price_short * e_shortage"
  surplus_sign: positive
  shortage_sign: negative
  # For a battery operating purely on imbalance:
  #   discharging above schedule  -> BRP surplus  -> receives price_long  per MWh
  #   charging  above schedule    -> BRP shortage -> pays     price_short per MWh

# ---------------------------------------------------------------------------
# Q4 — Incentive component
# ---------------------------------------------------------------------------
incentive_component:
  active: false
  value_eur_per_mwh: 0.0
  confidence: primary
  # [IPS61] revision history: version 5.0, 31/07/2020 — "Abolishment of incentive
  # component". No incentive/prikkel term appears anywhere in v6.0's price
  # determination (§4.2, §5). It therefore does NOT enter the settlement price
  # for any period from 2020-07-31 onward.
  abolished_on: "2020-07-31"
  source: "[IPS61] revision history (v5.0) + absence from §4.2/§5"

# ---------------------------------------------------------------------------
# Q6 — Price limits
# ---------------------------------------------------------------------------
price_limits:
  confidence: secondary   # TODO: verify against the ACER decision text itself
  note: >
    Balancing-energy bid price limits under the EBGL harmonised pricing
    methodology, not caps on the imbalance price as such. Transitional limits of
    +/-15000 EUR/MWh applied until July 2026, after which technical limits of
    +/-99999 EUR/MWh apply. A TSO proposal to lower the transitional limit to
    +/-10000 EUR/MWh was reported. Because the NL imbalance price is set by the
    marginal activated bid, these limits bound the imbalance price indirectly.
  transitional_max_eur_per_mwh: 15000
  transitional_min_eur_per_mwh: -15000
  transitional_until: "2026-07"
  technical_max_eur_per_mwh: 99999
  technical_min_eur_per_mwh: -99999
  source: "ACER decisions on the balancing pricing methodology (see docs/DOMAIN_NOTES.md Q6)"

# ---------------------------------------------------------------------------
# Q7/Q8 — Publication cadence and lag. Consumed by src/data/data_availability.py.
# ---------------------------------------------------------------------------
# lag_seconds is measured from the END of the period the datum describes to the
# moment it is first retrievable. `revised: true` means later vintages differ
# from first publication — R1 requires the FIRST-PUBLISHED vintage.
publication:
  balance_delta:
    # MEASURED 2026-08-07. Was `unresolved` from Phase 0 until then, because no
    # primary source publishes the value -- see lag_measurement below and
    # docs/DECISIONS.md ADR-006, ADR-017, ADR-019.
    rule: lag_after_period

    # CADENCE and DELAY are different things and must not be conflated.
    #   cadence = how often a new value is published
    #   lag     = how long after the instant it describes it becomes visible
    # TenneT's published 2025-26 changes are all CADENCE changes.
    cadence_seconds: 12          # from 2025-11-25; 60 before that
    cadence_confidence: primary
    cadence_source: "TenneT news, 'Balance delta now published every 12 seconds', 25 Nov 2025"

    lag_seconds: 146             # observed MAX of 974 samples, rounded up (not p95)
    lag_confidence: measured
    lag_measurement:
      method: >
        Polled https://api.tennet.eu/publications/v1/balance-delta-high-res/latest
        at TenneT's recommended cadence (5x/min, 1s after each 12s refresh),
        duty-cycled 10 min/hour to stay inside undisclosed hourly/daily caps.
        lag = first_seen - point.timeInterval_end. The interval END is used
        because a point covers [start, end) and is only complete at end.
      script: scripts/measure_balance_delta_lag.py
      samples: 974
      observed_from: "2026-08-07T12:15Z"
      observed_to: "2026-08-10T00:18Z"
      hours_covered: 60.1
      median_seconds: 133.2
      p95_seconds: 133.9
      max_seconds: 145.8
      encoded_value: 146
      why_max_not_p95: >
        R1 is ASYMMETRIC. Understating the lag claims data was retrievable
        earlier than it was -- look-ahead, on exactly the fraction of rows in
        the upper tail. Overstating it only withholds signal. Measured against
        this sample: encoding the median would leak on 49.9% of rows, p95 on
        4.9%, p99 on 0.9%, and the observed max on 0%. An earlier revision of
        this file encoded the p95 (134) on the strength of a 2-hour sample; a
        60-hour sample showed a 145.8s tail, so 134 would have leaked on about
        1 row in 20. Encode the max, and re-encode if a longer tail appears.
      time_of_day_variation: >
        NOT constant, contrary to the first 2-hour measurement. Two clusters:
        ~121.5s (15:00-17:00, 21:00-00:00 UTC) and ~133.5s (12:00-14:00 UTC),
        separated by 12.0s -- exactly one publication cadence tick. That
        strongly suggests poll-phase aliasing (our documented 0-12s upward
        bias) rather than two different TSO settings, but it is not proven
        either way, and the 23:00 outlier at 145.8s is two ticks. Treated as
        measurement noise in the conservative direction, not as a signal.
      known_bias: >
        Biased UP by 0-12s: we poll every 12s, so a point can sit published for
        up to one poll interval before we see it. Conservative for R1.
    # ---- COVERAGE LIMITATION. Read before trusting this for a backtest. ----
    lag_coverage_caveat: >
      Measured across 60.1 hours (2026-08-07 12:15Z to 2026-08-10 00:18Z),
      duty-cycled. Hours 01:00-11:00 and 18:00-20:00 UTC are still unobserved,
      as are weekends and scarcity/high-volatility
      periods -- exactly the conditions where a battery earns most and where a
      TSO is most likely to intervene. ADR-017 established from TenneT's own
      API docs that the delay is "configurable", i.e. a knob they turn.
      The 630 samples span only 1.0 second end to end (stdev 0.29s), which is
      consistent with a deterministic configured constant rather than a noisy
      pipeline -- but that is evidence about this window, not about all windows.
      RE-MEASURE across a full 24h before any headline revenue figure depends
      on it, and re-measure again if TenneT announces a platform change.
    lag_history:
      - from: "2026-08-07"
        lag_seconds: 134
        confidence: measured
        superseded: true
        note: >
          First measurement, 630 samples over one 2.18h afternoon. Encoded the
          p95. Superseded: a 60h sample found a 145.8s tail, so this value
          would have leaked on ~5% of rows.
      - from: "2026-08-10"
        lag_seconds: 146
        confidence: measured
        note: "974 samples over 60.1h. Encodes the observed max, not the p95."
    revised: false
    time_varying: unknown
    note: >
      Near-real-time operational signal: power of activated upward bids minus
      activated downward bids. Published intra-ISP, so it is the main legitimate
      within-ISP feature — which is exactly why its lag must be measured, not
      assumed. An over-generous lag is a direct R1 look-ahead violation.

  imbalance_price_settled:
    # Wall-clock, NOT a lag. [IPS61] §3.2: settlement for delivery day D starts
    # at 10:00 on D+1 -- one run settles the whole day, so every ISP of D
    # becomes available at the same instant. Previously modelled as a fixed 34h
    # lag, which was up to 21h too late for mid-day ISPs and silently crippled
    # the mandatory seasonal-naive baseline. See docs/DECISIONS.md ADR-014.
    rule: published_day_after_at
    local_time: "10:00"
    timezone: Europe/Amsterdam
    cadence_seconds: 900
    revised: false
    confidence: primary
    note: >
      The settlement-grade price. This is the TARGET variable, never a feature.
      [IPS61] §3.2: "After the delivery day (D+1), the process of financial
      settlement starts at 10.00 a.m."
    source: "[IPS61] §3.2"

  imbalance_price_realtime_estimate:
    rule: lag_after_period
    cadence_seconds: 60
    lag_seconds: 120
    revised: true           # estimate is superseded by the settled value
    confidence: secondary
    note: >
      TenneT's intra-ISP estimated price. Usable as a feature; must never be used
      as the target, and its revision to the settled value must be respected.

  regulation_state:
    # Settled by the same D+1 process as the price above.
    rule: published_day_after_at
    local_time: "10:00"
    timezone: Europe/Amsterdam
    cadence_seconds: 900
    revised: false
    confidence: primary
    note: >
      Definitive only once the full intra-ISP balance-delta trajectory is known,
      i.e. at ISP end at the earliest. Treat as target, not feature. An intra-ISP
      provisional state may be inferable from balance delta — if used, it must be
      reconstructed from lagged balance delta only, never read from the published
      settled value.

  day_ahead_price:
    rule: published_day_before_at
    local_time: "13:00"
    timezone: Europe/Amsterdam
    cadence_seconds: 900    # 60-min MTU before 2025-10-01, 15-min from then
    revised: false
    confidence: primary
    note: >
      Reg. 543/2013 Art. 12(2)(d): published no later than one hour after gate
      closure. SDAC gate closure is 12:00 CET on D-1, so day-ahead prices for the
      whole of day D are available from ~13:00 CET on D-1. The former
      lag_seconds: -1 sentinel meaning "available before the delivery day
      begins" has been replaced by this explicit day-before rule.
    source: "Reg. (EU) 543/2013 Art. 12(2)(d)"

  load_forecast_day_ahead:
    rule: published_day_before_at
    local_time: "10:00"
    timezone: Europe/Amsterdam
    revised: true
    confidence: primary
    note: "Reg. 543/2013 Art. 6(2)(b): no later than two hours before day-ahead gate closure."
    source: "Reg. (EU) 543/2013 Art. 6(2)(b)"

  wind_solar_forecast_day_ahead:
    rule: published_day_before_at
    local_time: "17:00"
    timezone: Europe/Amsterdam
    revised: true
    confidence: primary
    note: >
      Reg. 543/2013 Art. 14(2)(d): no later than 17:00 one day before delivery,
      with at least one intraday update at 07:00 on the delivery day. The pair
      (D-1 17:00 vintage, D 07:00 vintage) is the legitimate forecast-error proxy
      required by CLAUDE.md §4 Features.

      The top-level `rule` above resolves the FIRST vintage, which is the
      conservative default: code that does not ask for a vintage by name gets
      the earliest-published one and can never accidentally read a later
      revision. Named vintages are declared below.
    source: "Reg. (EU) 543/2013 Art. 14(2)(d)"
    vintages:
      # Order matters: earliest-published first. available_at() with no vintage
      # argument resolves vintages[0].
      - name: day_ahead
        rule: published_day_before_at
        local_time: "17:00"
        timezone: Europe/Amsterdam
        note: "Reg. 543/2013 Art. 14(2)(d): 'no later than 5 p.m., one day before delivery'."
      - name: intraday
        rule: published_same_day_at
        local_time: "07:00"
        timezone: Europe/Amsterdam
        note: >
          Same article: "regularly updated and published during intra-day
          trading with at least one update ... at 7 a.m. on the day of actual
          delivery". Differencing this against the day_ahead vintage gives the
          forecast-error proxy. Note it is NOT available for target periods
          early on the delivery day - a feature builder must check per period,
          not assume it.

  # NOTE on the other revised: true fields. Only wind_solar_forecast_day_ahead
  # has a declared vintage schedule so far. Load forecast, actual generation,
  # cross-border flows and the real-time imbalance estimate are all revised, but
  # on schedules not established from primary sources -- so they expose no named
  # vintages and available_at() returns their single conservative
  # first-publication time. Do not invent vintage schedules for them; measure
  # them from the vintage log (src/data/vintage.py) once it has run long enough.

  actual_generation:
    rule: lag_after_period
    lag_seconds: 3600
    revised: true
    confidence: primary
    note: "Reg. 543/2013 Art. 16(2)(b): no later than one hour after the operational period."
    source: "Reg. (EU) 543/2013 Art. 16(2)(b)"

  cross_border_physical_flow:
    rule: lag_after_period
    lag_seconds: 3600
    revised: true
    confidence: primary
    note: "Reg. 543/2013 Art. 12(2)(f): as close to real time as possible, no later than one hour after."
    source: "Reg. (EU) 543/2013 Art. 12(2)(f)"

  activated_balancing_volumes:
    rule: unresolved         # publication deadline never verified against the regulation text
    lag_seconds: null        # was 3600 (an unverified assumption); nulled so it cannot be read as a measurement
    revised: true
    confidence: assumed     # TODO: Reg. 543/2013 balancing articles not yet read
    note: >
      Deadline not yet verified against the regulation text. Do not use as a
      feature until it is. The previous lag_seconds: 3600 was an unverified
      assumption, not a measurement; it has been replaced with null so that
      code reading lag_seconds cannot mistake it for a real value.

# ---------------------------------------------------------------------------
# Q9 — Decision timestamp. THIS IS THE HARD INFORMATION CUTOFF IN THE BACKTEST.
# ---------------------------------------------------------------------------
decision:
  confidence: assumed
  offset_from_isp_start_seconds: 0
  rationale: >
    A battery acting on the imbalance signal for ISP t decides at or before the
    start of t. Choosing t's start (offset 0) means the newest usable balance
    delta observation is from t-1 minus the publication lag, which is the
    conservative reading of R1. An intra-ISP policy that re-decides during t is a
    strictly richer problem and is deliberately deferred; if it is added later,
    the cutoff must move with it, in this file, not in model code.
  # Effective information cutoff for target ISP t:
  #   availability of `field` for t is computed by
  #   available_at(field, target_period_start=start(t)), dispatched on the
  #   field's `rule` (lag_after_period / published_day_before_at / unresolved)
  #   rather than a single subtraction — `published_day_before_at` fields are
  #   pinned to a wall-clock local_time and cannot be expressed as
  #   start(t) - lag_seconds.
  #   `field` is usable for target ISP t iff
  #     available_at(field, t) < decision_time(t),  where decision_time(t) = start(t).
  # data_availability.available_at()/is_available() implement exactly this and
  # the feature builder must refuse any feature that is not strictly available
  # before decision_time(t).

# ---------------------------------------------------------------------------
# Structural breaks — regime changes that MUST be segmented in evaluation.
# ---------------------------------------------------------------------------
structural_breaks:
  - date: "2020-07-31"
    what: incentive_component_abolished
    confidence: primary
    impact: "Settlement price definition changed. Data before this date is a different target."
  - date: "2024-10-18"
    what: picasso_go_live_nl
    confidence: primary
    rules_changed: false
    impact: >
      TenneT joined the European aFRR platform PICASSO. RESOLVED by [IPS61]
      §4.2, added in v6.1 three days after go-live: "The CBMP determined by the
      PICASSO platform is not explicitly taken into account in the price
      determination." §4.3 adds: "There is no direct impact of participation in
      IGCC or PICASSO on the regulation state."

      So the PRICE FORMATION RULES are unchanged and this rule table is valid
      across the whole sample. The DISTRIBUTION still shifted: PICASSO relocates
      the residual power imbalance to the area with the most economical bids,
      which mechanically truncates the domestic merit order's extremes.
      Secondary sources report imbalance price volatility roughly halved.
      Segment evaluation on this date; do not drop pre-2024-10-18 data.

  # The 3 -> 5 -> 2 minute balance-delta publication-DELAY entries that used to
  # sit here have been REMOVED. Manual review of TenneT's own pages found only
  # CADENCE changes, and found delay described as an unexercised option. See
  # publication.balance_delta.lag_source and docs/DECISIONS.md ADR-006.

  - date: "2025-11-25"
    what: balance_delta_cadence_1min_to_12s
    confidence: primary
    impact: >
      Publication cadence only: 1/min -> 5/min -> every 12s. Does not by itself
      change the information LAG. It does mean a higher-resolution intra-ISP
      feature is available from this date, so any 12s-resolution feature is
      undefined before it.
    source: "TenneT news, 'Balance delta now published every 12 seconds', 25 Nov 2025"

  - date: "2026-02-03"
    what: regulation_state_input_switched_to_12s_balance_delta
    confidence: primary
    rules_changed: false
    impact: >
      TARGET-VARIABLE REGIME CHANGE. TenneT: "Starting 3 February 2026, we will
      determine the regulation state based on the new 12 second balance delta...
      Only the input changes from every minute to every 12 seconds."

      The state rule is unchanged in WORDING but not in EFFECT. State 2 requires
      the intra-ISP balance-delta series to both increase and decrease; states
      +1/-1 require monotonicity. Sampling the same underlying signal 75 times
      per ISP instead of 15 makes exact monotonicity strictly less likely, so
      the expected frequency of state 2 — the ONLY dual-priced state — should
      RISE at this date, with no change in the physical system.

      Consequences: (a) T1 class priors break at 2026-02-03; (b) dual pricing
      becomes more common, which raises the value of a calibrated P(state=2) in
      the dispatch policy; (c) only ~6 months of post-change data exist as of
      2026-08-04. Test the jump empirically in Phase 1 — it is a falsifiable
      prediction and a good check that the data pipeline is sane.
    source: "TenneT news, 'Balance delta now published every 12 seconds', 25 Nov 2025"

  - date: "2025-10-01"
    what: sdac_15min_mtu_go_live
    confidence: primary
    impact: >
      Day-ahead market moved from 60-min to 15-min MTU across SDAC. Day-ahead
      price features change resolution mid-sample; the DA-vs-imbalance spread
      (target T3) is not comparable across this boundary without care.
  # (The former "2025-11 balance_delta_published_every_12s" entry is superseded
  # by the dated, primary-sourced 2025-11-25 entry above.)
