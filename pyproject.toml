[project]
name = "nl-imbalance-lab"
version = "0.0.1"
description = "Dutch imbalance market forecasting and battery dispatch lab"
# Upper bound is deliberate: the Phase 2-3 stack (lightgbm, cvxpy, pyarrow)
# lags new CPython releases by months. Raise it when those wheels exist.
requires-python = ">=3.11,<3.13"

# Dependencies are added when the code that uses them is written, not in advance.
# Phase 0 needs only a YAML parser to read config/market_rules.yaml.
dependencies = [
    "pyyaml==6.0.2",
    "pandas==2.2.3",
    "pyarrow==15.0.2",
    "httpx==0.28.1",
    "entsoe-py==0.8.0",
    "numpy==1.26.4",
    "scikit-learn==1.9.1",
    "scipy>=1.17.1",
    "lightgbm==4.6.0",
    "cvxpy>=1.6.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.34.0",
    "streamlit>=1.40.0",
    "plotly>=5.24.0",
]

[dependency-groups]
dev = [
    "pytest==8.3.4",
    "ruff==0.9.2",
    "mypy==1.14.1",
    "types-pyyaml==6.0.12.20241230",
    "pandas-stubs==2.2.2.240909",
    "pre-commit>=4.6.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers -m 'not integration' --ignore=tests/cvxpy"
markers = [
    "integration: hits a live network API; excluded by default, run with -m integration",
    "cvxpy: uses cvxpy/osqp; run separately via 'pytest tests/cvxpy' (DLL conflict with lightgbm on Windows)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src", "tests", "scripts"]

[[tool.mypy.overrides]]
module = "sklearn.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "scipy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "lightgbm.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "cvxpy.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "plotly.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "streamlit.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "fastapi.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "src.optimisation.*"
disallow_any_unimported = false
disallow_untyped_calls = false
disable_error_code = ["attr-defined"]
